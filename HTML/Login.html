<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" type="text/css" href="../CSS/Login.css">
    <script src="#" type="text/javascript"></script> <!--API gets called here-->
</head>
<body>
    <div class="Login-Wrapper">
        <h1>YMCBay</h1>
        <h2>Welcome back! Login using your account</h2>
        <form id="Login-Form">
            <div class="Form-Wrapper">
                <label for="email">Email:</label>
                <input id="email" type="email" name="email" placeholder="Please enter your email here" required>
            </div>
            <div class="Form-Wrapper">
                <label for="passw">Password:</label>
                <input id="passw" type="password" name="passw" placeholder="Please enter your password here" required>
            </div>
            <button type="button" id="Login-Btn">Login</button>
            <a href="#" id="forgot-pw-link">Forgot Password?</a>
        </form>
        <div>
            <label>
                <input type="checkbox" id="enable-cookies" name="enable-cookies">
                <span>Remember Me (Enable Cookies)</span>
            </label>
        </div>
        <div>
            Don't have an account?
            <a href="Register.html">Sign up for free!</a>
        </div>
    </div>
</body>
</html>
